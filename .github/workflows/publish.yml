name: Publish

# Manually triggered release to npm using Trusted Publishing (OIDC).
# No npm token is stored anywhere; npm trusts this workflow file + the `npm-publish` environment.
# See https://docs.npmjs.com/trusted-publishers
#
# The version comes from CHANGELOG.md: the one `## x.y.z` heading NOT marked ` - deployed` is the version
# that gets released, and the text under it becomes the GitHub release notes. The release commit marks
# that heading `## x.y.z - deployed`; it is only pushed after npm publish succeeds.
# Before running: add a `## <new version>` section at the top of CHANGELOG.md, merge it to master,
# and wait for CI on that commit to pass.

on:
  workflow_dispatch:
    inputs:
      dist_tag:
        description: npm dist-tag. Leave empty for automatic (latest for x.y.z, next for x.y.z-rc.1 and other pre-releases)
        type: string
        required: false
        default: ''
      dry_run:
        description: Dry run (npm publish --dry-run, no push, no GitHub release)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: npm-publish
    timeout-minutes: 30
    permissions:
      contents: write # push release commit + tag, create GitHub release
      id-token: write # OIDC token for npm trusted publishing (also enables provenance)
      checks: read # confirm CI passed on the commit being released

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # No dependency cache in the release job: a poisoned cache entry would end up in the published package.
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # Trusted publishing requires npm >= 11.5.1
      - name: Update npm
        run: npm install -g npm@^11.5.1 && npm --version

      - name: Check CI passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          RUNS=$(gh api "repos/$REPO/commits/$SHA/check-runs?per_page=100" \
            --jq '.check_runs[] | select(.name != "Publish to npm") | "\(.name)\t\(.status)\t\(.conclusion)"')
          if [ -z "$RUNS" ]; then
            echo "::error::No CI results for $SHA. Wait for the Test workflow to run on this commit."
            exit 1
          fi
          echo "$RUNS"
          BAD=$(echo "$RUNS" | awk -F'\t' '$2 != "completed" || ($3 != "success" && $3 != "skipped" && $3 != "neutral")')
          if [ -n "$BAD" ]; then
            echo "::error::CI has not passed on $SHA (pending or failed checks listed below). Wait for it to finish or fix it, then run again."
            echo "$BAD"
            exit 1
          fi

      # The release commit is pushed to master after npm publish. If master has moved since this run
      # started, that push is rejected while the package is already on npm. Fail before publishing instead.
      - name: Check this run is on the tip of master
        run: |
          git fetch origin master
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/master)" ]; then
            echo "::error::master moved since this run started ($(git rev-parse --short HEAD) -> $(git rev-parse --short origin/master)). Re-run the workflow."
            exit 1
          fi

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: npm ci

      # Accepted heading forms: "## 6.5.0", "## v6.5.0", "## [6.5.0]", "## 6.5.0 (2026-11-20)", "## 7.0.0-rc.1".
      - name: Read version from CHANGELOG
        id: version
        env:
          DIST_TAG_INPUT: ${{ inputs.dist_tag }}
        run: |
          if ! VERSION=$(node scripts/changelog.js next 2> "$RUNNER_TEMP/changelog-error.txt"); then
            echo "::error::$(head -n 1 "$RUNNER_TEMP/changelog-error.txt")"
            cat "$RUNNER_TEMP/changelog-error.txt"
            exit 1
          fi
          CURRENT=$(node -p "require('./package.json').version")
          # Use the semver module bundled with npm to make sure the CHANGELOG version is newer.
          SEMVER="$(npm root -g)/npm/node_modules/semver"
          if ! node -e "process.exit(require('$SEMVER').gt('$VERSION', '$CURRENT') ? 0 : 1)"; then
            echo "::error::CHANGELOG.md top version $VERSION is not newer than package.json version $CURRENT. Add a new '## x.y.z' section at the top of CHANGELOG.md."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Tag v$VERSION already exists"
            exit 1
          fi
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          if [ -n "$(npm view "$PACKAGE_NAME@$VERSION" version 2>/dev/null)" ]; then
            echo "::error::$PACKAGE_NAME@$VERSION is already on npm. Add a new '## x.y.z' section to CHANGELOG.md for the next release."
            exit 1
          fi

          DIST_TAG=$(echo "$DIST_TAG_INPUT" | tr -d '[:space:]')
          if [ -z "$DIST_TAG" ]; then
            case "$VERSION" in *-*) DIST_TAG=next ;; *) DIST_TAG=latest ;; esac
          fi
          if ! echo "$DIST_TAG" | grep -Eq '^[a-z][a-z0-9._-]*$'; then
            echo "::error::dist_tag '$DIST_TAG' is not a valid tag name (use a word like latest, next, beta; not a version number)"
            exit 1
          fi
          case "$VERSION" in *-*)
            if [ "$DIST_TAG" = "latest" ]; then
              echo "::error::$VERSION is a pre-release; publishing it as 'latest' would install it for everyone. Leave dist_tag empty (uses 'next') or pick another tag."
              exit 1
            fi ;;
          esac

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$DIST_TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing v$VERSION (was $CURRENT) with dist-tag '$DIST_TAG'"

      - name: Set package version and mark CHANGELOG deployed
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Save the notes before the heading changes.
          node scripts/changelog.js notes "$VERSION" > "$RUNNER_TEMP/notes.md"
          npm version "$VERSION" --no-git-tag-version --ignore-scripts
          node scripts/changelog.js mark "$VERSION"

      - name: Commit and tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git commit -am "release: v$VERSION"
          git tag -a "v$VERSION" -m "v$VERSION"

      # prepublishOnly runs: clean dist -> npm ci -> build -> test -> prune devDependencies.
      # Provenance is generated automatically when publishing via trusted publishing.
      - name: Publish
        env:
          DIST_TAG: ${{ steps.version.outputs.dist_tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            npm publish --tag "$DIST_TAG" --dry-run
          else
            npm publish --tag "$DIST_TAG"
          fi

      # --atomic: the branch and the tag land together or not at all (a plain push can update the
      # tag while master is rejected). If master moved during the publish, rebase the release commit
      # (it only touches package.json, package-lock.json and the CHANGELOG heading) and retry once.
      - name: Push commit and tag
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git push --atomic origin HEAD:master "refs/tags/v$VERSION"; then
            exit 0
          fi
          echo "::warning::Push rejected, master probably moved during the release. Rebasing and retrying once."
          git fetch origin master
          git rebase origin/master
          git tag -f -a "v$VERSION" -m "v$VERSION"
          if ! git push --atomic origin HEAD:master "refs/tags/v$VERSION"; then
            echo "::error::v$VERSION is published on npm, but the release commit and tag could not be pushed. Fix by hand: git fetch origin master && git checkout master && git cherry-pick <release commit> && git tag -a v$VERSION -m v$VERSION && git push --atomic origin master refs/tags/v$VERSION"
            exit 1
          fi

      - name: Create GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          DIST_TAG: ${{ steps.version.outputs.dist_tag }}
        run: |
          if [ ! -s "$RUNNER_TEMP/notes.md" ] || [ "$(tr -d '[:space:]' < "$RUNNER_TEMP/notes.md")" = "" ]; then
            echo "::warning::No release notes found under '## $VERSION' in CHANGELOG.md"
          fi
          PRERELEASE=""
          case "$VERSION" in *-*) PRERELEASE="--prerelease" ;; esac
          LATEST=""
          [ "$DIST_TAG" != "latest" ] && LATEST="--latest=false"
          # shellcheck disable=SC2086
          gh release create "v$VERSION" --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md" $PRERELEASE $LATEST
